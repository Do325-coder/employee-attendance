{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block guest %}
<div class="login">
  <section class="login-art"><h1>PayTrack</h1><p>Attendance in the morning. Salary slips at month end.</p></section>
  <form method="post" class="login-card">{% csrf_token %}
    <h2>Sign in</h2>
    {% if form.errors %}<div class="toast error">Wrong username or password. Try again.</div>{% endif %}
    <label>Username <input name="username" autofocus required></label>
    <label>Password <input type="password" name="password" required></label>
    <button class="btn">Sign in</button>
  </form>
</div>
{% endblock %}
